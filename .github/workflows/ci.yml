name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # aiosqlite backs the in-memory test DB but is not declared in pyproject
        run: pip install -e ".[dev]" aiosqlite
      - name: Test
        run: pytest -q
