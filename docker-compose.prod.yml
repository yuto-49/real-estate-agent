# Production overrides — layer on top of docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    volumes: []                    # remove dev bind-mount
    command:
      - gunicorn
      - main:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=4
      - --bind=0.0.0.0:8000
      - --timeout=120
      - --access-logfile=-
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      target: prod               # nginx stage
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes: []                   # remove dev bind-mount
    deploy:
      resources:
        limits:
          memory: 128M
