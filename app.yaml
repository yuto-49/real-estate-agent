# DigitalOcean App Platform spec template for a same-origin deployment.
# Replace the GitHub repo/branch values before creating the app:
#   doctl apps create --spec app.yaml

name: real-estate-agent
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_WITH_OWNER/REPO
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      - key: MIROFISH_MODE
        scope: RUN_TIME
        value: mock
      - key: MARKET_DATA_PROVIDER
        scope: RUN_TIME
        value: mock
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: VITE_API_BASE_URL
        scope: RUN_TIME
        value: /api
      - key: VITE_WS_URL
        scope: RUN_TIME
        value: /ws
      - key: VITE_MAP_STYLE_URL
        scope: RUN_TIME
        value: https://basemaps.cartocdn.com/gl/positron-gl-style/style.json
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: REPLACE_WITH_SUPABASE_URL
      - key: VITE_SUPABASE_URL
        scope: RUN_TIME
        value: REPLACE_WITH_SUPABASE_URL
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY
      - key: DATABASE_URL
        scope: RUN_TIME
        value: REPLACE_WITH_DATABASE_URL
      - key: REDIS_URL
        scope: RUN_TIME
        value: REPLACE_WITH_REDIS_URL
