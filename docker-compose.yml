# Development compose — uses shared Postgres/Redis from ~/docker-shared-services.yml
#
# Prerequisites:
#   docker network create shared-dev
#   docker compose -f ~/docker-shared-services.yml up -d postgres redis
#
# Usage:
#   docker compose up              # backend + frontend (dev mode)
#   docker compose up app          # backend only
#   docker compose up frontend     # frontend only

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - .:/app
      - /app/__pycache__        # exclude pycache from mount
      - /app/.git               # exclude .git from mount
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - shared-dev

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # exclude node_modules from mount
    environment:
      - VITE_API_BASE_URL=http://localhost:${APP_PORT:-8000}
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - shared-dev

networks:
  shared-dev:
    external: true
    name: shared-dev
